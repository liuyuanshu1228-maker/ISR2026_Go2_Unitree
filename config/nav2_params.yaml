# nav2_params.yaml  -  Go2 iSR 2026  (ROS 2 HUMBLE)
# Owner: Jingyu (everything except the amcl: section, which belongs to Yuanshu).
#
# Rules:
#   - use_sim_time stays False here. navigation.launch.py overrides it with the
#     use_sim_time launch argument (RewrittenYaml), so the same file works in
#     simulation and on the robot.
#   - map yaml path is also set in the launch file, not here.
#   - Frames: map -> odom -> base_footprint -> base_link -> livox_frame.
#     Nav2 uses base_footprint everywhere (stays level when the body tilts).
#   - Items marked CHECK come from docs and are not tested on our robot yet.
#
# Velocity chain (remappings are done in navigation.launch.py):
#   controller_server -> /cmd_vel_nav
#   velocity_smoother -> /cmd_vel_smoothed
#   collision_monitor -> /cmd_vel   -> cmd_vel_bridge.py -> Go2

# ---------------------------------------------------------------- AMCL (Yuanshu)
amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    robot_model_type: "nav2_amcl::OmniMotionModel"   # Humble; Foxy: "omnidirectional" (CHECK ROS version)
    min_particles: 500
    max_particles: 2000
    laser_max_range: 15.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    update_min_d: 0.2
    update_min_a: 0.2
    transform_tolerance: 1.0
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 0.0          # TODO: real start pose on the map
      y: 0.0
      z: 0.0
      yaw: 0.0

# ---------------------------------------------------------------- BT navigator
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # plugin_lib_names: Humble has built-in defaults, so the long list is left out (CHECK).

# ---------------------------------------------------------------- Controller (DWB)
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      # --- the "dynamic window": speed and acceleration limits (start slow)
      min_vel_x: 0.0          # no reversing: the Go2 has no rear sensing
      max_vel_x: 0.4
      min_vel_y: -0.2         # side-steps both ways
      max_vel_y: 0.2
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.3
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.3
      decel_lim_theta: -1.0
      # TODO Wednesday: find the smallest speed the Go2 really moves at and keep
      # min speeds above it (commands below it may do nothing).
      # --- trajectory sampling
      vx_samples: 20
      vy_samples: 10
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      # --- scoring
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ---------------------------------------------------------------- Local costmap
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.35, 0.16], [0.35, -0.16], [-0.35, -0.16], [-0.35, 0.16]]"
      footprint_padding: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan                 # switch to /livox/lidar (PointCloud2) later if low objects are missed
          data_type: "LaserScan"
          marking: True
          clearing: True
          # NOTE: a /scan point has z = 0, so min_obstacle_height must be 0.0.
          # With 0.05 (as first planned) every scan point would be dropped.
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: True

# ---------------------------------------------------------------- Global costmap
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.35, 0.16], [0.35, -0.16], [-0.35, -0.16], [-0.35, 0.16]]"
      footprint_padding: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: True

# ---------------------------------------------------------------- Map server
# yaml_filename is passed by navigation.launch.py / localization.launch.py
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

# ---------------------------------------------------------------- Planner
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# ---------------------------------------------------------------- Behaviours (recoveries)
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"      # CHECK: no rear sensing on the Go2, see notes
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

# ---------------------------------------------------------------- Waypoints (Kayla's loop mission)
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ---------------------------------------------------------------- Velocity smoother (Humble+)
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.2, 0.8]
    min_velocity: [0.0, -0.2, -0.8]
    max_accel: [0.5, 0.3, 1.0]
    max_decel: [-0.5, -0.3, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ---------------------------------------------------------------- Collision monitor (Humble+)
# Stops the robot if a scan point lies inside the stop box in front of the body.
# Box (base_footprint, metres): from the nose (x = 0.35) to x = 0.65,
# 0.1 m wider than the body on each side (half-width 0.16 + 0.10 = 0.26).
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["StopBox"]
    StopBox:
      type: "polygon"
      points: [0.65, 0.26, 0.65, -0.26, 0.35, -0.26, 0.35, 0.26]
      action_type: "stop"
      min_points: 4
      visualize: True
      polygon_pub_topic: "stop_box"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.0
      max_height: 2.0
