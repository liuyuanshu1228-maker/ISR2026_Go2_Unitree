# slam_toolbox settings for building the map once (research notes #1)
# Owner: Yuanshu. Started by launch/mapping.launch.py (async mode).
#
# Frames: map -> odom -> base_footprint (section 2 of the plan).
#   odom -> base_footprint comes from scripts/odom_publisher.py (Jingyu),
#   map -> odom is published by slam_toolbox while mapping.
# Save the map when done:
#   ros2 run nav2_map_server map_saver_cli -f maps/soit_map
slam_toolbox:
  ros__parameters:
    # ---- Plugins (defaults, written out so the file is complete) ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- Frames and topics (agreed interface, section 2) ----
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping # localisation is done by AMCL (Kayla), not here

    # ---- Output ----
    use_map_saver: true
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 # map -> odom at 50 Hz
    map_update_interval: 2.0 # seconds between /map updates (Foxglove view)
    resolution: 0.05 # 5 cm cells, same as the costmaps
    max_laser_range: 15.0 # same as range_max of the scan slice
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000 # needed to serialise large maps
    enable_interactive_mode: false

    # ---- When to add a new scan (walk slowly, the Go2 body shakes) ----
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3 # m
    minimum_travel_heading: 0.3 # rad
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ---- Loop closure: seeing the same wall again corrects the map ----
    # Failure sign from the notes: one real wall drawn twice -> scans did not
    # line up. Walk slower, check the odom TF, keep loop closure on.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- Correlation (scan matching) ----
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---- Scan matcher weights ----
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
